# Ruff — formatter + linter (replaces flake8). Rule set: modernize-library-py312 design D-5.
line-length = 127
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[format]
quote-style = "double"
indent-style = "space"
