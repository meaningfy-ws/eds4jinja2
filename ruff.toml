# Ruff — formatter + linter (replaces flake8). Rule set: modernize-library-py312 design D-5.
line-length = 127
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[format]
quote-style = "double"
indent-style = "space"

[lint.per-file-ignores]
# Engine(str, Enum) -> StrEnum would change str(Engine.X) for callers; not a forced break (DEC-6).
"eds4jinja2/models/data_source.py" = ["UP042"]
