# This is a basic workflow to help you get started with Actions

name: test

# Gate per PR (every commit pushed to a PR re-runs this) and on merge to master.
# No branch globs on push, so a PR branch is tested once (via pull_request), not twice.
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# Ensure redundant parallel runs don't occur in the same workflow.
# Use either PR or branch information to prevent such runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in
# parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: check-all
    strategy:
      fail-fast: false
    # A job can run for multiple environments
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        # eds4jinja2 is pure-Python; CI runs on Linux only. Uncomment macOS/Windows below to
        # restore cross-platform coverage (Windows would also need a `make` install step).
        os:
          - ubuntu-latest
          # - macos-latest
          # - windows-latest
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}-${{ matrix.python-version}}
      cancel-in-progress: true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Check out
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js (openspec validate)
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install Poetry
      run: pipx install "poetry>=2.0.0,<3.0.0"
    - name: Install dependencies
      run: |
        poetry env use python
        poetry check --lock
        make install
    - name: Gate (lint, types, architecture, spec, tests)
      run: make check-all
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        env_vars: OS,PYTHON
        name: codecov-umbrella
        fail_ci_if_error: true
