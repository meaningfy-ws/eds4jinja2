# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.poetry], [build-system] live here; every tool is
# configured in its own root file: ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
# The single source of truth for the version is eds4jinja2/VERSION; `make check-version` fails when
# the `version` field below drifts from it.

[project]
name = "eds4jinja2"
version = "1.0.4"
description = "Embed the data source specifications in your JINJA templates directly, and enjoy the dynamic data contexts."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Apache-2.0" }
authors = [{ name = "Eugeniu Costetchi", email = "costezki.eugen@gmail.com" }]
maintainers = [{ name = "Eugeniu Costetchi", email = "costezki.eugen@gmail.com" }]
keywords = ["template", "jinja", "report", "report generation", "rdf", "sparql", "linked-data", "data-source", "dynamic-context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]
dependencies = [
    "Jinja2~=3.1.2",
    "SPARQLWrapper~=2.0.0",
    "pandas~=2.2.0",
    "PyYAML~=6.0.1",
    "toml~=0.10.2",
    "xlrd~=2.0.1",        # pandas read_excel backend for .xls
    "openpyxl~=3.1.2",    # pandas read_excel backend for .xlsx
    "numpy~=1.26.0",
    "click~=8.1.7",
    "rdflib~=7.0.0",
    "pydantic~=2.0",
    "beautifulsoup4~=4.12.2",
    "requests~=2.31.0",
]

[project.optional-dependencies]
# Opt-in fast in-memory SPARQL engine for the built-in graph store (the `oxigraph` engine of
# `from_rdf` / make_graph_store). The rdflib engine needs no extra.
oxigraph = ["pyoxigraph~=0.4"]

[project.urls]
Homepage = "https://github.com/meaningfy-ws/eds4jinja2"
Documentation = "https://meaningfy-ws.github.io/eds4jinja2/"

[project.scripts]
mkreport = "eds4jinja2.entrypoints.cli.main:build_report"

[dependency-groups]
# PEP 735 groups, installed via `poetry install --with test,lint,dev`.
test = [
    "tabulate~=0.9.0",
    "pytest~=7.4.2",
    "pytest-bdd~=7.0.0",
    "pytest-cov~=4.1.0",
    "pytest-subtests~=0.11.0",
]
lint = [
    "ruff",
    "mypy",
    "import-linter~=2.0",
]
dev = [
    "twine~=6.2",
]

[tool.poetry]
# No-src layout: include the top-level package directly. VERSION ships inside the package.
packages = [{ include = "eds4jinja2" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
