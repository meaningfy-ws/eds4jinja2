# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.poetry], [build-system] live here; every tool is
# configured in its own root file: ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
# The single source of truth for the version is eds4jinja2/VERSION; `make check-version` fails when
# the `version` field below drifts from it.

[project]
name = "eds4jinja2"
version = "2.1.0"
description = "Embed the data source specifications in your JINJA templates directly, and enjoy the dynamic data contexts."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "Apache-2.0" }
authors = [{ name = "Eugeniu Costetchi", email = "costezki.eugen@gmail.com" }]
maintainers = [{ name = "Eugeniu Costetchi", email = "costezki.eugen@gmail.com" }]
keywords = ["template", "jinja", "report", "report generation", "rdf", "sparql", "linked-data", "data-source", "dynamic-context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]
# Runtime ranges stay open to the next major so consumers' resolvers are not over-constrained
# (modernize-library-py312 design D-2).
dependencies = [
    "Jinja2>=3.1.6,<4",
    "SPARQLWrapper>=2.0.0,<3",
    "pandas>=3.1.0,<4",
    "numpy>=2.5.4,<3",
    "PyYAML>=6.0.3,<7",
    "python-calamine>=0.9,<1",  # pandas read_excel engine for .xls and .xlsx (replaces xlrd + openpyxl)
    "click>=8.5.0,<9",
    "rdflib>=7.6.0,<8",
    "pydantic>=2.14.2,<3",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
# Opt-in fast in-memory SPARQL engine for the built-in graph store (the `oxigraph` engine of
# `from_rdf` / make_graph_store). The rdflib engine needs no extra.
oxigraph = ["pyoxigraph>=0.5.13,<0.6"]

[project.urls]
Homepage = "https://github.com/meaningfy-ws/eds4jinja2"
Documentation = "https://meaningfy-ws.github.io/eds4jinja2/"

[project.scripts]
mkreport = "eds4jinja2.entrypoints.cli.main:build_report"

[dependency-groups]
# PEP 735 groups, installed via `poetry install --with test,lint`. Exact pins (design D-1).
test = [
    "beautifulsoup4==4.15.0",
    "pytest==9.1.1",  # shortcut: pytest-bdd 9.0.0 breaks on pytest 9.2 (FixtureManager._arg2fixturedefs); bump with the next pytest-bdd
    "pytest-bdd==9.0.0",
    "pytest-cov==7.1.0",
]
lint = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
]

[tool.poetry]
# No-src layout: include the top-level package directly. VERSION ships inside the package.
packages = [{ include = "eds4jinja2" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
