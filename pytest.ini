[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
# Coverage flags live only in the Makefile `test` target, so plain `pytest` stays fast.
addopts =
    -r a
    -v
    --strict-markers
    --gherkin-terminal-reporter

log_cli = true
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

junit_family = xunit2

markers =
    network: test drives a live external SPARQL endpoint (excluded from the default gate)
